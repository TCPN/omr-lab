name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: uv sync --dev --locked --extra synthetic
      - name: Ruff
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest
