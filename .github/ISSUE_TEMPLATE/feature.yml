name: Feature or research task
description: Propose a bounded implementation or experiment
title: "feat: "
labels: ["type: feature"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use testable checkboxes where possible
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Dependencies and risks
    validations:
      required: false
