[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "omr-lab"
version = "0.1.0"
description = "A modular, testable Optical Music Recognition pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "jsonschema>=4.18",
]

[project.optional-dependencies]
# Rendering and degrading the synthetic corpus (`omr-lab synthesize`, docs/synthetic-corpus.md).
synthetic = [
    "cairosvg>=2.7",
    "numpy>=2.0",
    "pillow>=11.0",
    "verovio>=6.0",
]
# OpenCV image preprocessing before recognition (`--preprocess`, docs/preprocessing.md).
preprocess = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
]

[project.scripts]
omr-lab = "omr_lab.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/omr_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Shared test helpers (tests/e2e_report.py) are imported as top-level modules.
pythonpath = ["tests"]
# Marked tests are deselected by default (and in CI). A `-m` given on the
# command line replaces this one, e.g. `uv run pytest -m integration`.
addopts = "-ra --strict-markers -p pytester -m 'not integration and not gpu and not network'"
markers = [
    "integration: needs a real OMR engine, Java, or other external tools",
    "gpu: needs a CUDA-capable GPU",
    "network: needs network access, model downloads, or API credentials",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
