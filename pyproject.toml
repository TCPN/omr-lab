[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omr-lab"
version = "0.1.0"
description = "A modular, testable Optical Music Recognition pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "License to be decided; review before distribution" }
dependencies = []

[project.scripts]
omr-lab = "omr_lab.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/omr_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
